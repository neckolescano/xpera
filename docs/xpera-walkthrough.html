<style>
/* Layout: a control strip (lab + user) on top, a "what's new" note, then the app window itself — sidebar + screen. */
:root {
  /* Brand: Signal Red #F43F5E and Carbon #121212, with their tints and shades. Bone #F4F1EA is background only. */
  --red: #F43F5E; --red-ink: #C3324B; --red-soft: #FEECEF; --red-line: #FBB2BF;
  --carbon: #121212; --bone: #F4F1EA;
  --page: #E7E7E7; --surface: #FFFFFF; --app: #F4F1EA;
  --ink: #121212; --muted: #595959; --soft: #898989; --line: #E7E7E7; --line-strong: #D0D0D0;
  --side: #121212; --side-ink: #D0D0D0; --side-dim: #717171;
  /* Status colors come from the brand too: done = Carbon tint, needs attention = red. */
  --good: #121212; --good-soft: #E7E7E7; --warn: #C3324B; --warn-soft: transparent; --info: #595959; --info-soft: transparent;
  --display: "Sora", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0E0E0E; --surface: #1D1D1D; --app: #121212; --ink: #FFFFFF; --muted: #B8B8B8; --soft: #898989; --line: #2A2A2A; --line-strong: #414141;
  --red-soft: #310D13; --red-ink: #F88C9E; --red-line: #922638; --side: #050505;
  --good: #FFFFFF; --good-soft: #2A2A2A; --warn: #F88C9E; --info: #B8B8B8; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #0E0E0E; --surface: #1D1D1D; --app: #121212; --ink: #FFFFFF; --muted: #B8B8B8; --soft: #898989; --line: #2A2A2A; --line-strong: #414141;
  --red-soft: #310D13; --red-ink: #F88C9E; --red-line: #922638; --side: #050505;
  --good: #FFFFFF; --good-soft: #2A2A2A; --warn: #F88C9E; --info: #B8B8B8; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--page); color: var(--ink); font: 15px/1.5 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px }
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 18px }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: -0.02em; margin: 0; text-wrap: balance }
.brand { display: flex; align-items: center; gap: 12px }
.brand > div { min-width: 0 }
.brand > svg { flex: none }
.brand h1 { font-size: clamp(20px, 3.2vw, 26px) }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: 14px }
.controls { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px }
.ctl { display: grid; gap: 6px; min-width: 0 }
.ctl > span { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.seg { display: flex; flex-wrap: wrap; gap: 4px; background: var(--app); border-radius: 12px; padding: 4px }
.seg button { font: 600 13px var(--body); color: var(--muted); background: transparent; border: 0; border-radius: 9px; padding: 8px 12px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--carbon); color: #F4F1EA }
.seg button:disabled { opacity: .4; cursor: not-allowed }
.seg button:focus-visible, .nav button:focus-visible, .btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px }
.note { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px }
.note h2 { font-size: 18px; margin-bottom: 6px }
.note ul { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px }
.note .why { background: var(--red-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; color: var(--ink) }
.note .why b { color: var(--red-ink) }
/* App window */
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--app); min-height: 680px }
.side { background: var(--side); color: var(--side-ink); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px }
.side .logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; color: #F4F1EA; font: 600 22px var(--display); letter-spacing: -0.04em }
.nav { display: flex; flex-direction: column; gap: 2px }
.nav button { all: unset; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 12px; border-radius: 10px; font: 500 14px var(--body); color: var(--side-ink); cursor: pointer }
.nav button:hover { background: #2A2A2A }
.nav button[aria-current="page"] { background: var(--red); color: #121212; font-weight: 600 }
.nav button.locked { color: var(--side-dim); cursor: help }
.nav .lk { font-size: 10px; font-weight: 600; letter-spacing: .04em; border: 1px solid #414141; color: #898989; border-radius: 999px; padding: 1px 7px }
.side .store { margin-top: auto; padding: 14px 8px 0; display: grid; gap: 4px; font-size: 12px; color: #898989 }
.side .store b { color: #F4F1EA; font-size: 13px }
.planchip { justify-self: start; background: #2A2A2A; color: #F6657E; border-radius: 999px; padding: 2px 8px; font-weight: 600; font-size: 11px }
.main { padding: 24px 28px; display: grid; gap: 16px; align-content: start; min-width: 0 }
.top { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center }
.top h3 { font-size: 24px }
.top p { margin: 2px 0 0; color: var(--muted); font-size: 13px }
.db { display: inline-flex; gap: 6px; align-items: center; font: 500 12px var(--body); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px }
.db svg { flex: none }
.btn { font: 600 13px var(--body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 8px 14px; cursor: pointer }
.btn.primary { background: var(--red); border-color: var(--red); color: #121212 }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0 }
.card h4 { margin: 0 0 2px; font: 600 14px var(--body) }
.card .sub { margin: 0 0 10px; color: var(--muted); font-size: 12px }
.tbl { overflow-x: auto }
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums }
th { text-align: left; font-weight: 500; color: var(--soft); padding: 6px 8px; white-space: nowrap }
td { padding: 10px 8px; border-top: 1px solid var(--line); white-space: nowrap }
td:first-child { font-weight: 600 }
.pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 500 }
.p-red { background: var(--red-soft); color: var(--red-ink) } .p-gray { background: var(--line); color: var(--muted) } .p-good { background: var(--good-soft); color: var(--good); font-weight: 600 } .p-good::before { content: "✓ " } .p-warn { background: var(--warn-soft); color: var(--warn); box-shadow: inset 0 0 0 1px var(--red-line) } .p-info { background: var(--info-soft); color: var(--info); box-shadow: inset 0 0 0 1px var(--line-strong) } .p-dark { background: var(--ink); color: var(--surface) }
.stars { color: var(--red); letter-spacing: 1px } .stars i { color: var(--line); font-style: normal }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px }
.kpi span { font-size: 12px; color: var(--muted) } .kpi b { font: 600 22px var(--display); letter-spacing: -0.03em } .kpi small { font-size: 11px; color: var(--muted) }
.kpi.hot { background: var(--carbon); border-color: var(--carbon) } .kpi.hot span, .kpi.hot small { color: #B8B8B8 } .kpi.hot b { color: var(--red) }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px }
.chart svg { width: 100%; height: auto; display: block }
.chart text { fill: var(--muted); font: 11px var(--body) }
.g-line { stroke: var(--line) } .c-red { fill: var(--red); stroke: var(--red) } .c-ink { fill: var(--ink); stroke: var(--ink) }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.label { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.empty { display: grid; place-items: center; text-align: center; gap: 8px; padding: 48px 20px; color: var(--muted) }
.empty b { color: var(--ink); font: 600 18px var(--display) }
.branchsel { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted) }
select { font: 500 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--carbon); color: #F4F1EA; border-radius: 12px; padding: 10px 14px; font-size: 13px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none }
.toast.show { opacity: 1; transform: none }
/* Record sale: who and what on the left, payment on the right (from the Figma design) */
.co-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(250px, 1fr); gap: 14px; align-items: start }
.co-main { display: grid; gap: 14px; min-width: 0 }
.cust { display: flex; gap: 12px; align-items: center; background: var(--app); border-radius: 12px; padding: 12px 14px }
.avatar { flex: none; width: 38px; height: 38px; border-radius: 50%; background: var(--carbon); color: var(--bone); display: grid; place-items: center; font: 600 14px var(--display) }
.cust-name { font-weight: 600 }
.cust-meta { font-size: 12px; color: var(--muted) }
.linksel { margin-left: auto; border: 0; background: transparent; color: var(--red-ink); font: 600 13px var(--body); padding: 4px; cursor: pointer; max-width: 120px }
.addsel { width: 100%; border: 1px dashed var(--line-strong); background: transparent; color: var(--muted); border-radius: 10px; padding: 11px 12px; font: 500 13px var(--body); cursor: pointer }
.qty { display: inline-flex; gap: 8px; align-items: center }
.qty button, .xbtn { font: 600 13px var(--body); width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer }
.pay { display: grid; gap: 14px }
.pay .seg { display: grid; grid-template-columns: 1fr 1fr }
.pay input[type=date] { font: 500 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px; padding: 8px 10px; width: 100% }
.sumrows { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 12px; font-size: 13px; font-variant-numeric: tabular-nums; border-top: 1px solid var(--line); padding-top: 12px }
.sumrows .muted { color: var(--muted) }
.sumrows .total { font: 600 15px var(--body); align-self: end }
.sumrows .total-v { font: 600 24px var(--display); letter-spacing: -0.02em }
.note-red { background: var(--red-soft); color: var(--red-ink); border-radius: 10px; padding: 10px 12px; font-size: 12px }
.btn.wide { width: 100%; padding: 12px 14px; font-size: 14px }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--muted) }
.pager .btn:disabled { opacity: .4; cursor: not-allowed }
@media (max-width: 900px) { .co-grid { grid-template-columns: 1fr } }
/* Way-finding: grouped menu, breadcrumb, and one shared list pattern (search, count, pages) */
.nav .grp { font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--side-dim); padding: 14px 12px 4px }
.nav .grp:first-child { padding-top: 0 }
.crumbs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-bottom: 4px }
.crumbs b { color: var(--ink); font-weight: 600 }
.crumbs i { font-style: normal; color: var(--soft) }
.listbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: space-between; margin-bottom: 8px }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 10px; background: var(--surface); min-width: 0; flex: 0 1 280px }
.search input { border: 0; outline: 0; background: transparent; color: var(--ink); font: 500 13px var(--body); padding: 8px 0; width: 100%; min-width: 0 }
.search:focus-within { border-color: var(--red) }
.search svg { flex: none; color: var(--soft) }
.count { font-size: 12px; color: var(--muted) }
.pages { display: flex; gap: 4px; align-items: center }
.pages button { font: 600 12px var(--body); min-width: 30px; height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums }
.pages button[aria-current="page"] { background: var(--carbon); border-color: var(--carbon); color: var(--bone) }
.pages button:disabled { opacity: .35; cursor: not-allowed }
.pages button:focus-visible, .search input:focus-visible { outline: 2px solid var(--red); outline-offset: 2px }
.noresult { padding: 22px 8px; text-align: center; color: var(--muted); font-size: 13px }
@media (max-width: 860px) {
  .note { grid-template-columns: 1fr }
  .app { grid-template-columns: 1fr }
  .side { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px }
  .side .logo { padding: 0 8px }
  .nav { flex-direction: row; flex-wrap: wrap }
  .side .store { margin: 0; padding: 4px 8px; flex-basis: 100% }
  .nav .grp { display: none }
  .grid2, .grid3 { grid-template-columns: 1fr }
  .main { padding: 18px 14px }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none } }
</style>

<script>
// ---------- logo ----------
(function () {
  const s2 = Math.SQRT1_2, O = [50, 50], f = v => v.toFixed(2), pt = q => f(q[0]) + ',' + f(q[1]);
  const kite = (dx, dy, L, w, mid) => { const d = [dx * s2, dy * s2], p = [-d[1], d[0]], T = [O[0] + d[0] * L, O[1] + d[1] * L], m = [O[0] + d[0] * mid, O[1] + d[1] * mid]; return { C: O, T, A: [m[0] + p[0] * w, m[1] + p[1] * w], B: [m[0] - p[0] * w, m[1] - p[1] * w] }; };
  const poly = k => [k.C, k.A, k.T, k.B].map(pt).join(' ');
  const tx = 50 - ((50 - 40 * s2) + (50 + 58 * s2)) / 2, ty = 50 - ((50 - 58 * s2) + (50 + 40 * s2)) / 2, r = kite(1, -1, 58, 8.5, 13);
  const mk = ink => `<g transform="translate(${f(tx)} ${f(ty)})"><polygon points="${poly(kite(-1,-1,40,9.5,15))}" fill="${ink}"/><polygon points="${poly(kite(-1,1,40,9.5,15))}" fill="${ink}"/><polygon points="${poly(kite(1,1,40,9.5,15))}" fill="${ink}"/><polygon points="${pt(r.C)} ${pt(r.A)} ${pt(r.T)}" fill="#F43F5E"/><polygon points="${pt(r.C)} ${pt(r.T)} ${pt(r.B)}" fill="#F43F5E" fill-opacity="0.55"/></g>`;
  document.getElementById('logoBig').innerHTML = mk('currentColor');
  document.getElementById('logoSmall').innerHTML = mk('#F4F1EA');
})();

// ---------- model ----------
const PLAN = { 1: 'A', 2: 'B', 3: 'C' };
// [screen, plan that unlocks it, menu group]. Groups follow the store's day: look, sell, care, run.
const FEATURES = [
  ['Dashboard', 'B', 'Insights'], ['Reports', 'B', 'Insights'],
  ['Sales', 'A', 'Sell'], ['Payments', 'A', 'Sell'], ['Products', 'A', 'Sell'],
  ['Customers', 'A', 'Customer care'], ['Inquiries', 'A', 'Customer care'], ['Complaints', 'A', 'Customer care'], ['Feedback', 'A', 'Customer care'], ['Retention', 'B', 'Customer care'],
  ['Branches', 'C', 'Store'], ['Users', 'A', 'Store']
];
const ROLE_CAN = {
  'Admin': ['Dashboard', 'Products', 'Customers', 'Sales', 'Payments', 'Inquiries', 'Complaints', 'Feedback', 'Retention', 'Reports', 'Branches', 'Users'],
  'Cashier': ['Customers', 'Sales', 'Payments'],
  'Staff': ['Products', 'Customers', 'Inquiries', 'Complaints', 'Feedback', 'Retention']
};
const MASTER = ['Overview', 'Tenants', 'Subscriptions'];
const rank = { A: 1, B: 2, C: 3 };
const LAB_NOTES = {
  1: ['Lab 1 · Tenant A: data collection', ['Sign in with a store code, so xpera opens the right store database.', 'Keep a product list with Available or Not available, but no stock counts.', 'Keep customer records, and record sales at a simple checkout, plus payments (main transactions).', 'Log inquiries, complaints, and feedback, and move each one to Resolved.']],
  2: ['Lab 2 · Tenant B: business intelligence and actions', ['Everything from Lab 1 stays.', 'New: Dashboard with 5 strategic KPIs and 6 graphs.', 'New: Operational reports (print or PDF in the real app).', 'New: Retention campaigns. Each one records its reason (from a dashboard graph), its goal, and its dates. Staff tells the customers, and the Cashier applies the promo at checkout.']],
  3: ['Final · Tenant C + Master: the whole system', ['Everything from Labs 1 and 2 stays.', 'New for Tenant C: Branches, with a branch filter and branch comparison.', 'New: the Master, where the Super Admin (you) manages every tenant and its plan.']]
};
const state = { lab: 3, role: 'Admin', screen: 'Dashboard', branch: 'All branches', camp: 0, coCust: 'Nina Go', applied: false, cart: [{ n: 'Gaming mouse', q: 1 }], coPay: 'Cash', coDue: '2026-11-20', salesTab: 'checkout', salesPage: 0, fuOpen: '', fuMethod: 'Call', fuDone: {}, newCamp: false, nc: {} };
try { const s = JSON.parse(localStorage.getItem('xpera-walk') || 'null'); if (s) Object.assign(state, s, { newCamp: false, nc: {}, camp: s.camp > 3 ? 0 : s.camp }); } catch (e) {}

// ---------- sample data (examples) ----------
const customers = [['Nina Go','0917 555 0188','Mice, pads','₱2,140',4,'Aug 10','Cebu'],['Ria Mendoza','0918 555 0164','Headsets','₱6,450',4,'Today','Davao'],['Marco Reyes','0917 555 0142','GPUs, cooling','₱64,980',5,'Today','Cebu'],['Alyssa Tan','0918 555 0193','Peripherals','₱18,450',4,'Yesterday','Davao'],['Jomar Cruz','0927 555 0108','RAM, storage','₱12,300',2,'Oct 15','Cebu'],['Bea Santos','0915 555 0176','Monitors','₱9,990',5,'Oct 12','Iloilo'],['Paolo Diaz','0919 555 0121','Full builds','₱86,500',3,'Oct 9','Davao'],['Kyle Lim','0995 555 0130','Keyboards','₱4,250',4,'Oct 18','Iloilo']];
// Products: [name, category, price, available]. A status only, no stock counts.
const products = [['RTX 5070 Ti 16GB', 'Graphics cards', 48995, false], ['RTX 4070 Super 12GB', 'Graphics cards', 38995, true], ['Ryzen 7 7800X3D', 'Processors', 24950, true], ['32GB DDR5 RAM', 'Memory', 5990, false], ['27" 165Hz monitor', 'Monitors', 9990, true], ['Mechanical keyboard', 'Peripherals', 4590, true], ['Gaming mouse', 'Peripherals', 2990, true], ['Wireless headset', 'Peripherals', 6450, true]];
// Inquiries: [date, customer, question, product waited for, status]
const inquiries = [['Oct 21', 'Marco Reyes', 'Is the RTX 5070 Ti available?', 'RTX 5070 Ti 16GB', 'Waiting for product'], ['Oct 21', 'Kyle Lim', 'When is the RTX 5070 Ti coming back?', 'RTX 5070 Ti 16GB', 'Waiting for product'], ['Oct 20', 'Alyssa Tan', 'Do you have 32GB DDR5 RAM?', '32GB DDR5 RAM', 'Waiting for product'], ['Oct 20', 'Bea Santos', 'Can I reserve a 27" 165Hz monitor?', '', 'Open'], ['Oct 18', 'Paolo Diaz', 'PSU wattage for a full build', '', 'Resolved']];
// Complaints: [date, customer, complaint, type, status]

const cellText = c => String(c).replace(/<option(?![^>]*selected)[^>]*>[^<]*<\/option>/g, '').replace(/<[^>]+>/g, ' ').toLowerCase();
function ptable(key, head, rows) {
  state.q = state.q || {}; state.pg = state.pg || {};
  const q = (state.q[key] || '').trim().toLowerCase(), noun = NOUNS[key] || 'rows';
  const found = q ? rows.filter(r => r.some(c => cellText(c).includes(q))) : rows;
  const pages = Math.max(1, Math.ceil(found.length / PER_PAGE)), pg = Math.min(state.pg[key] || 0, pages - 1);
  const shown = found.slice(pg * PER_PAGE, pg * PER_PAGE + PER_PAGE);
  const nums = Array.from({ length: pages }, (_, i) => `<button type="button" data-pg="${key}" data-to="${i}" ${i === pg ? 'aria-current="page"' : ''} aria-label="Page ${i + 1}">${i + 1}</button>`).join('');

  const pager = pages > 1 ? `<div class="pager"><span>${pg * PER_PAGE + 1}–${pg * PER_PAGE + shown.length} of ${found.length}</span><span class="pages"><button type="button" data-pg="${key}" data-to="${pg - 1}" ${pg === 0 ? 'disabled' : ''} aria-label="Previous page">‹</button>${nums}<button type="button" data-pg="${key}" data-to="${pg + 1}" ${pg >= pages - 1 ? 'disabled' : ''} aria-label="Next page">›</button></span></div>` : '';

const W = 420, H = 180, PL = 34, PB = 22, PT = 10, PR = 10;
function axes(min, max, steps, fmt) { let s = ''; for (let i = 0; i <= steps; i++) { const v = min + (max - min) * i / steps, y = PT + (H - PT - PB) * (1 - i / steps); s += `<line class="g-line" x1="${PL}" x2="${W - PR}" y1="${y}" y2="${y}"/><text x="${PL - 6}" y="${y + 4}" text-anchor="end">${fmt(v)}</text>`; } return s; }
function xLabels(labels, xs) { return labels.map((l, i) => `<text x="${xs(i)}" y="${H - 6}" text-anchor="middle">${l}</text>`).join(''); }
const months = ['May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct'];
function lineChart(vals, min, max, steps, fmt, cls, area) {
  const xs = i => PL + 10 + (W - PL - PR - 20) * i / (vals.length - 1), ys = v => PT + (H - PT - PB) * (1 - (v - min) / (max - min));
  const pts = vals.map((v, i) => `${xs(i)},${ys(v)}`).join(' ');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${axes(min, max, steps, fmt)}${area ? `<polygon class="${cls}" fill-opacity="0.12" stroke="none" points="${xs(0)},${H - PB} ${pts} ${xs(vals.length - 1)},${H - PB}"/>` : ''}<polyline class="${cls}" fill="none" stroke-width="2.5" points="${pts}" style="fill:none"/>${vals.map((v, i) => `<circle cx="${xs(i)}" cy="${ys(v)}" r="${i === vals.length - 1 ? 5 : 3.5}" class="${cls}" style="stroke:var(--surface);stroke-width:2"/>`).join('')}${xLabels(months, xs)}</svg>`;
}
function stackChart(a, b, max) {
  const n = a.length, bw = 30, xs = i => PL + 10 + (W - PL - PR - 20) * (i + .5) / n, sc = v => (H - PT - PB) * v / max;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${axes(0, max, 4, v => Math.round(v))}${a.map((v, i) => `<rect class="c-ink" x="${xs(i) - bw / 2}" y="${H - PB - sc(b[i])}" width="${bw}" height="${sc(b[i])}"/><rect class="c-red" x="${xs(i) - bw / 2}" y="${H - PB - sc(b[i]) - sc(v)}" width="${bw}" height="${sc(v)}"/>`).join('')}${xLabels(months, xs)}</svg>`;
}
function hbars(rows, max) { return `<div style="display:grid;gap:9px;margin-top:4px">${rows.map(([n, v], i) => `<div style="display:grid;grid-template-columns:96px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:12px"><span style="font-weight:500">${n}</span><span style="height:14px;border-radius:4px;background:${i === 0 ? 'var(--red)' : 'var(--ink)'};opacity:${i === 0 ? 1 : .8};width:${Math.max(3, 100 * v / max)}%"></span><span style="color:var(--muted);text-align:right;font-variant-numeric:tabular-nums">₱${v.toLocaleString('en-US')}</span></div>`).join('')}</div>`; }
function donut(parts) {
  const tot = parts.reduce((s, p) => s + p[1], 0); let a = -Math.PI / 2, d = '';
  const arc = (r, a0, a1) => { const P = t => [80 + r * Math.cos(t), 80 + r * Math.sin(t)]; const A = P(a0), B = P(a1); return `M${A[0].toFixed(1)} ${A[1].toFixed(1)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${B[0].toFixed(1)} ${B[1].toFixed(1)}`; };
  for (const [n, v, c] of parts) { const b = a + 2 * Math.PI * v / tot; d += `<path d="${arc(56, a, b - .04)}" stroke="${c}" stroke-width="24" fill="none"/>`; a = b; }
  return `<div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 160 160" style="width:150px" role="img">${d}<text x="80" y="78" text-anchor="middle" style="font:600 22px var(--display);fill:var(--ink)">${tot}</text><text x="80" y="96" text-anchor="middle">concerns</text></svg><div style="display:grid;gap:8px;font-size:13px">${parts.map(([n, v, c]) => `<span><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${c};margin-right:6px"></i>${n} <span style="color:var(--muted)">${v} · ${Math.round(100 * v / tot)}%</span></span>`).join('')}</div></div>`;
}
function vbars(rows, max) {

function createCampaign() {
  const n = state.nc, { t, names, count } = ncList(), type = n.type || 'Promo';
  const st = n.start || '2026-10-26', en = n.end || '2026-11-15', a = Date.parse(st + 'T00:00:00Z'), b = Date.parse(en + 'T00:00:00Z'), day = 864e5;
  const status = TODAY < a ? 'Upcoming' : TODAY > b ? 'Ended' : 'Active';
  const note = status === 'Upcoming' ? `Starts in ${Math.round((a - TODAY) / day)} days` : status === 'Ended' ? 'Ended ' + fmtDate(en) : `${Math.round((b - TODAY) / day)} days left`;
  const name = (n.name || '').trim() || (type === 'Promo' ? 'New promo' : 'New loyalty reward');
  campaigns.push([name, type, t[0], fmtDate(st), fmtDate(en), status, note, count, 0, 0, 0, 0, status === 'Active' ? (TODAY - a) / (b - a) : 0]);
  const goal = (n.goal || '').trim() || `Bring back ${Math.round(count / 3)} customers`, num = parseInt(goal.replace(/[^0-9]/g, ''), 10) || Math.round(count / 3);
  reasons.push([(n.reason || '').trim() || 'No reason written yet.', 'Dashboard · ' + (n.based || graphs[5]), goal, num, 0, 'Mark Villanueva (Admin) · Oct 21']);
  names.forEach(x => { if (!custCamp[x]) custCamp[x] = [name, status === 'Upcoming' ? 'starts ' + fmtDate(st) : 'ends ' + fmtDate(en), type]; });
  state.camp = campaigns.length - 1; state.newCamp = false; state.nc = {};
  return [name, count];
}

function render() {
  try { localStorage.setItem('xpera-walk', JSON.stringify(state)); } catch (e) {}
  if (state.role === 'Super Admin' && state.lab !== 3) state.role = 'Admin';
  // controls
  document.querySelectorAll('#labSeg button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.lab === state.lab)));
  document.querySelectorAll('#roleSeg button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.role === state.role)); b.disabled = b.dataset.role === 'Super Admin' && state.lab !== 3; });
  if (state.role === 'Super Admin' && state.lab !== 3) state.role = 'Admin';
  const menu = visibleMenu();
  if (!menu.find(m => m.n === state.screen && !m.locked)) state.screen = (menu.find(m => !m.locked) || {}).n;
  // note
  const [t, items] = LAB_NOTES[state.lab]; $('noteTitle').textContent = t;
  $('noteList').innerHTML = items.map(i => `<li>${i}</li>`).join('');
  const plan = PLAN[state.lab], lockedCount = menu.filter(m => m.locked).length;
  $('noteWhy').innerHTML = state.role === 'Super Admin'
    ? `<b>You are the Super Admin.</b> You are in the Master, with its own database (<code>xpera_master</code>). You manage stores and their plans, but you don't work inside a store.`
    : `<b>Why this menu?</b> Gaming Hub is on <b>Plan ${plan}</b> and you're signed in as <b>${state.role}</b>. The role hides what this user doesn't do${lockedCount ? `, and the plan locks ${lockedCount} feature${lockedCount > 1 ? 's' : ''} (shown with a plan tag)` : ''}. The app connects to <code>gaminghub_db</code>.`;
  // sidebar
  $('nav').innerHTML = menu.map((m, i) => `${i === 0 || menu[i - 1].group !== m.group ? `<div class="grp">${m.group}</div>` : ''}<button type="button" id="nav-${m.n}" ${m.locked ? `class="locked" title="Unlocks on Plan ${m.need}"` : ''} ${m.n === state.screen ? 'aria-current="page"' : ''} data-screen="${m.n}" data-locked="${m.locked}"><span>${m.n}</span>${m.locked ? `<span class="lk">Plan ${m.need}</span>` : ''}</button>`).join('');
  $('store').innerHTML = state.role === 'Super Admin' ? `<b>xpera Master</b><span>Super Admin</span><span class="planchip">Platform owner</span>` : `<b>Gaming Hub</b><span>${state.role}${state.lab === 3 ? ' · ' + (state.role === 'Admin' ? 'All branches' : 'Cebu branch') : ''}</span><span class="planchip">Tenant ${plan} · ${{ A: 'Micro', B: 'Small', C: 'Medium' }[plan]}</span>`;
  // main
  const fn = S[state.screen];
  if (!fn) { $('main').innerHTML = `<div class="empty"><b>Nothing to show</b><span>This user has no screens on this plan.</span></div>`; return; }
  const [title, sub, actions, body] = fn();
  const db = state.role === 'Super Admin' ? 'xpera_master' : 'gaminghub_db';
  const branchCtl = state.lab === 3 && state.role === 'Admin' && ['Dashboard', 'Customers'].includes(state.screen) ? `<label class="branchsel" for="branch">Branch <select id="branch">${['All branches', 'Cebu', 'Davao', 'Iloilo'].map(b => `<option ${b === state.branch ? 'selected' : ''}>${b}</option>`).join('')}</select></label>` : '';
  const here = menu.find(m => m.n === state.screen) || {}, place = state.role === 'Super Admin' ? 'xpera Master' : 'Gaming Hub';
  const crumbs = `<nav class="crumbs" aria-label="You are here"><span>${place}</span><i>›</i><span>${here.group || ''}</span><i>›</i><b>${title}</b></nav>`;
  $('main').innerHTML = `<div class="top"><div>${crumbs}<h3>${title}</h3><p>${sub}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${branchCtl}<span class="db">${dbIcon}${db}</span>${actions}</div></div>${body}`;
}

// ---------- events ----------
$('labSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; state.lab = +b.dataset.lab; if (state.lab !== 3) state.branch = 'All branches'; render(); });
$('roleSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; state.role = b.dataset.role; state.screen = ''; render(); });
$('nav').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.locked === 'true') { toast(`${b.dataset.screen} unlocks when the store upgrades to Plan ${b.title.slice(-1)}`); return; } state.screen = b.dataset.screen; render(); });
$('main').addEventListener('click', e => {
  const q = e.target.closest('[data-qty]'); if (q) { const l = state.cart[+q.dataset.qty]; l.q += +q.dataset.d; if (l.q < 1) state.cart.splice(+q.dataset.qty, 1); render(); return; }
  const rm = e.target.closest('[data-rm]'); if (rm) { state.cart.splice(+rm.dataset.rm, 1); render(); return; }
  const py = e.target.closest('[data-pay]'); if (py) { state.coPay = py.dataset.pay; render(); return; }
  const st = e.target.closest('[data-stab]'); if (st) { state.salesTab = st.dataset.stab; state.salesPage = 0; render(); return; }
  const pgb = e.target.closest('[data-pg]'); if (pgb && !pgb.disabled) { state.pg = state.pg || {}; state.pg[pgb.dataset.pg] = +pgb.dataset.to; render(); document.querySelector(`[data-pg="${pgb.dataset.pg}"][aria-current="page"]`)?.closest('.card')?.scrollIntoView({ block: 'nearest' }); return; }
  if (e.target.closest('[data-cocancel]')) { state.cart = []; state.applied = false; state.coPay = 'Cash'; render(); toast('Sale cleared'); return; }
  if (e.target.closest('[data-cosave]')) { if (!state.cart.length) { toast('Add a product first'); return; }
    const price = n => (products.find(x => x[0] === n) || [0, 0, 0])[2], sub = state.cart.reduce((t, l) => t + price(l.n) * l.q, 0), promo = state.lab >= 2 && state.applied ? custPromo[state.coCust] : null, total = sub - (promo ? Math.min(sub, promo[2] * sub + promo[3]) : 0), amt = '₱' + Math.round(total).toLocaleString('en-US');
    sales.unshift(['OR-000' + nextOR++, 'Oct 21', state.coCust, state.cart.map(l => (l.q > 1 ? l.q + ' × ' : '') + l.n).join(', '), state.coPay, amt, promo ? promo[0].split(':')[0] : '—']);
    if (state.coPay === 'Credit') balances.unshift([state.coCust, amt, new Date(state.coDue + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }), 'On track']);
    const who = state.coCust, pay = state.coPay; state.cart = []; state.applied = false; state.coPay = 'Cash'; render(); toast(`Sale saved under ${who}${pay === 'Credit' ? '. Balance added to Payments' : ''}${promo ? '. Linked to the campaign' : ''}`); return; }
  if (e.target.closest('[data-apply]')) { state.applied = true; render(); toast('Reward applied. When saved, this sale is linked to the campaign.'); return; } const fo = e.target.closest('[data-fu]'); if (fo) { state.fuOpen = fo.dataset.fu; state.fuMethod = 'Call'; render(); $('main').querySelector('.card .seg')?.scrollIntoView({ block: 'center' }); return; }
  const fm = e.target.closest('[data-method]'); if (fm) { state.fuMethod = fm.dataset.method; render(); return; }
  if (e.target.closest('[data-fucancel]')) { state.fuOpen = ''; render(); return; }
  if (e.target.closest('[data-fusave]')) { const n = state.fuOpen, r = $('fuResult').value; state.fuDone[n] = { method: state.fuMethod, result: r, note: $('fuNote').value.trim(), by: state.role === 'Admin' ? 'Mark Villanueva' : 'Ben Torres' }; state.fuOpen = ''; render(); toast(`Saved: ${n} · ${state.fuDone[n].method} · ${r}`); return; }
  const g = e.target.closest('[data-goto]'); if (g) { state.screen = 'Retention'; state.newCamp = true; state.nc = { reason: 'At-risk customers went up from 31 to 47 since August', based: graphs[5], target: 0 }; render(); toast('New campaign: the reason is filled in from Graph 6'); return; }
  if (e.target.closest('[data-newcamp]')) { state.newCamp = true; state.nc = {}; render(); return; }
  if (e.target.closest('[data-nccancel]')) { state.newCamp = false; state.nc = {}; render(); return; }
  const nt = e.target.closest('[data-nctype]'); if (nt) { state.nc.type = nt.dataset.nctype; render(); return; }
  const nr = e.target.closest('[data-ncrm]'); if (nr) { const x = nr.dataset.ncrm, n = state.nc; if ((n.extra || []).includes(x)) n.extra = n.extra.filter(y => y !== x); else n.removed = (n.removed || []).concat([x]); render(); return; }
  if (e.target.closest('[data-nccreate]')) { const [nm, c] = createCampaign(); render(); toast(`Created “${nm}”. ${c} customers now have it under their name.`); return; } const k = e.target.closest('[data-camp]'); if (k) { state.camp = +k.dataset.camp; render(); return; } const b = e.target.closest('[data-act]'); if (b) toast(b.dataset.act + ' (preview only)'); });
$('main').addEventListener('input', e => {
  if (e.target.id && e.target.id.startsWith('q-')) { const k = e.target.id.slice(2), pos = e.target.selectionStart; state.q = state.q || {}; state.pg = state.pg || {}; state.q[k] = e.target.value; state.pg[k] = 0; render(); const box = $(e.target.id); if (box) { box.focus(); box.setSelectionRange(pos, pos); } return; } if (e.target.dataset && e.target.dataset.nc) state.nc[e.target.dataset.nc] = e.target.value; });
$('main').addEventListener('change', e => {
  if (e.target.id === 'branch') { state.branch = e.target.value; render(); }
  else if (e.target.id === 'target') { state.nc.target = +e.target.value; state.nc.removed = []; render(); }
  else if (e.target.id === 'ncAdd' && e.target.value) { const x = e.target.value, n = state.nc; n.removed = (n.removed || []).filter(y => y !== x); if (!targets[n.target || 0][2].includes(x)) n.extra = (n.extra || []).concat([x]); render(); }
  else if (e.target.dataset && e.target.dataset.nc) state.nc[e.target.dataset.nc] = e.target.value;
  else if (e.target.id === 'coProd' && e.target.value) { const l = state.cart.find(x => x.n === e.target.value); if (l) l.q++; else state.cart.push({ n: e.target.value, q: 1 }); render(); }
  else if (e.target.id && e.target.id.startsWith('avail-')) { const x = products[+e.target.id.slice(6)]; x[3] = e.target.value === 'Available'; const w = inquiries.filter(q => q[3] === x[0] && q[4] === 'Waiting for product').length; render(); toast(x[3] && w ? `${x[0]} is back. ${w} customer${w > 1 ? 's are' : ' is'} waiting: see Inquiries` : `${x[0]}: ${e.target.value}`); }
  else if (e.target.id && e.target.id.startsWith('inq-')) { inquiries[+e.target.id.slice(4)][4] = e.target.value; render(); }
  else if (e.target.id && e.target.id.startsWith('cmp-')) { complaints[+e.target.id.slice(4)][4] = e.target.value; render(); }
  else if (e.target.id === 'coDue') { state.coDue = e.target.value || state.coDue; render(); }
  else if (e.target.id === 'coCust') { state.coCust = e.target.value; state.applied = false; render(); }
  else if (e.target.id && e.target.id.startsWith('plan-')) toast(`${e.target.dataset.store} moved to Plan ${e.target.value}: its menu changes on next sign-in`);
  else if (e.target.id && e.target.id.startsWith('act-')) toast(`Result recorded: ${e.target.value}. The tracking numbers update.`);
});
render();
</script>
